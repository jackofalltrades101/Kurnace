[package]
name = "kurn-core"
description = "Kurnace core: doc host, op layer, library, module runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yrs = { version = "0.28", features = ["sync"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
sha2 = "0.10"
ulid = "3"
anyhow = "1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"
notify = "8"

[dev-dependencies]
tempfile = "3"
