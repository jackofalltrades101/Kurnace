[package]
name = "kurnace-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
portable-pty = "0.9"
kurn-core = { path = "../../crates/kurn-core" }
keyring = { version = "4.2.0", default-features = false, features = ["apple-native-keyring-store", "v1", "windows-native-keyring-store"] }
