name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos-and-windows:
    # macOS runner cross-builds the Windows .exe with cargo-xwin. A native
    # windows-latest job can replace it later for an MSI/NSIS build.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-pc-windows-msvc

      - name: install tools
        run: |
          brew install llvm lld nsis
          cargo install cargo-xwin --locked

      - name: dependencies
        run: pnpm install --frozen-lockfile

      - name: macOS app + dmg
        run: scripts/build-mac-app.sh

      - name: Windows exe + installer
        run: scripts/build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Kurnace-macOS
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/Kurnace.app

      - uses: actions/upload-artifact@v4
        with:
          name: Kurnace-Windows
          path: |
            dist/windows/Kurnace-*-windows-x64.zip
            dist/windows/Kurnace-Setup-*.exe
