id = "render.compositor"
version = "0.1.0"
kind = "renderer"
name = "Kurnace compositor"
description = "Render a timeline (media, HTML scenes, text) with the Kurnace compositor in headless Chromium"
runtime = "node"
entry = "run.ts"
license = "MIT"
deterministic = true

[requires]
bins = ["ffmpeg", "ffprobe"]

[inputs]
timeline     = { type = "json", required = true }
assets       = { type = "json", required = true }
project_root = { type = "string" }
mode         = { type = "string", default = "final" }  # still | draft | final
frame        = { type = "number", default = 0 }
range        = { type = "string" }                     # "start-end" frames, end exclusive
scale        = { type = "number", default = 1.0, min = 0.1, max = 1.0 }
out          = { type = "string", required = true }

[outputs]
file = { type = "file" }

[agent]
expose = true
cost_hint = "local"
