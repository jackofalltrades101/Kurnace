id = "three.render"
version = "0.1.0"
kind = "generator"
name = "three.js render"
description = "Render a declarative three.js scene to a PNG frame sequence in headless Chromium"
runtime = "node"
entry = "run.ts"
license = "MIT"
deterministic = true

[requires]
bins = ["node"]

[inputs]
scene  = { type = "json", description = "scene descriptor: {background, camera, objects, lights}" }
file   = { type = "string", description = "path to a scene JSON file, relative to the project root" }
frames = { type = "integer", default = 60, min = 1, max = 1800 }
fps    = { type = "integer", default = 30, min = 1, max = 120 }
width  = { type = "integer", default = 640, min = 16, max = 7680 }
height = { type = "integer", default = 360, min = 16, max = 4320 }

[outputs]
frames = { type = "asset", kind = "seq" }

[ui]
icon = "cube"
category = "3D"

[agent]
expose = true
cost_hint = "local"
