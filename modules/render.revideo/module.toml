id = "render.revideo"
version = "0.0.1"
kind = "renderer"
name = "Revideo TimelineRenderer"
description = "Render a Kurnace timeline (or a frame range / still) with Revideo"
runtime = "node"
entry = "run.ts"
license = "MIT"
deterministic = true

[requires]
bins = ["ffmpeg", "ffprobe"]

[inputs]
timeline = { type = "json", required = true }
assets   = { type = "json", required = true }   # { ast_id: { path, kind, width?, height? } }
mode     = { type = "string", default = "final" }  # still | draft | final
frame    = { type = "number", default = 0 }
range    = { type = "string" }                  # "start-end" in frames, end exclusive
scale    = { type = "number", default = 1.0, min = 0.1, max = 1.0 }
out      = { type = "string", required = true }

[outputs]
file = { type = "file" }

[agent]
expose = true
cost_hint = "local"
